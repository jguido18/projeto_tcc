  # Apenas adicionamos aqui o que a gem NÃO cobre.
  # ─────────────────────────────────────────────────────────────────────────────

  # Ausente no rails-i18n pt-BR — usado pelo partial devise/shared/_error_messages
  errors:
    messages:
      not_saved:
        one: "1 erro impediu que este %{resource} fosse salvo:"
        other: "%{count} erros impediram que este %{resource} fosse salvo:"

